services:
  - type: web
    name: djq-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 15m
      - key: REFRESH_EXPIRY
        value: 168h
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT
        value: "200"
      - key: RATE_LIMIT_WINDOW
        value: 1m
      - key: GROQ_API_KEY
        sync: false
      - key: AI_SUMMARY_MODEL
        value: openai/gpt-oss-20b
      - key: DEMO_USER_EMAIL
        sync: false

  - type: web
    name: djq-worker
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PROJECT_ID
        sync: false
      - key: WORKER_QUEUES
        value: ""
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: POLL_INTERVAL
        value: 500ms
      - key: HEARTBEAT_INTERVAL
        value: 10s
      - key: ENV
        value: production
      - key: DEMO_MODE
        sync: false
      - key: DEMO_INTERVAL
        value: 6s
      - key: DEMO_BURST
        value: "1"
      - key: DEMO_BACKLOG_MAX
        value: "60"

  - type: web
    name: djq-web
    runtime: node
    rootDir: web
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
